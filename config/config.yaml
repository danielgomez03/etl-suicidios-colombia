project:
  name: Presuntos Suicidios Colombia 2015-2024
  version: "0.1"
  description: >-
    Pipeline ETL con arquitectura medallon (bronze, silver, gold) para la base
    "Presuntos Suicidios. Colombia, 2015 a 2024. Cifras definitivas" (INMLCF)
    y las proyecciones de poblacion departamental del DANE.
  authors:
    - Ana Maria Toro
    - Ana Sofia Perhueza
    - Daniel Gomez Sermeno
    - Daniel Steven Colmenares
  license: MIT
  repository: https://github.com/danielgomez03/etl-suicidios-colombia
  created: "2026-10-01"

paths:
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold
  logs_dir: logs

period:
  start_year: 2015
  end_year: 2024

# Una entrada por fuente. type: csv | excel | sql | api
sources:
  # Casos individuales de presunto suicidio (INMLCF) - 26.558 registros
  suicidios:
    type: api
    url: https://www.datos.gov.co/resource/f75u-mirk.json
    token_env: SOCRATA_APP_TOKEN        # nombre de la variable en .env (no el token)
    batch_size: 50000
    order: ":id"
    raw_path: data/bronze/suicidios_raw.csv
    use_cache: true                     # false = vuelve a descargar de la API
    key: id

  # Proyecciones de poblacion departamental DANE (por area), retroproyeccion 2005-2017
  poblacion_2005_2017:
    type: excel
    path: data/bronze/DCD-area-proypoblacion-dep-2005-2017_VP.xlsx
    sheet: 0
    skiprows: null                      # TODO: filas de titulo antes del encabezado (revisar en el EDA)

  # Proyecciones de poblacion departamental DANE (por area), 2018-2050
  poblacion_2018_2050:
    type: excel
    path: data/bronze/PPED-AreaDep-2018-2050_VP.xlsx
    sheet: 0
    skiprows: null                      # TODO: filas de titulo antes del encabezado (revisar en el EDA)

# Fuentes que se unen fila a fila en gold. La poblacion NO se une por registro:
# se usa despues, agregada por departamento y anio, para calcular tasas por 100.000 hab.
integration:
  sources: [suicidios]
  on: null
  how: left

database:
  gold_table: gold_suicidios

formats:
  date_formats: ["%Y-%m-%d", "%d/%m/%Y", "%m-%d-%Y", "%d-%b-%Y", "%B %d, %Y"]

rules:
  fill_text: Sin informacion
